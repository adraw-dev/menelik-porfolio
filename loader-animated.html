<style>
:root{--bg:#182b35;--ink:#f5edde;--fill:#faf6f9;--ctl:rgba(250,246,249,.72);

html,body{height:100%;margin:0;background:var(--bg)}
.cl-loader{position:relative;height:100%;min-height:320px;display:grid;place-items:center;overflow:hidden;background:var(--bg)}
.cl-loader svg{--ar:2.4;display:block;width:min(88vw,1120px,calc(76svh * var(--ar)));height:auto;overflow:visible}
.cl-loader .cl-outline path{fill:none;stroke:var(--ink);stroke-width:11;stroke-linecap:round;stroke-linejoin:round}
.cl-loader .cl-outline .cl-word path{stroke-width:4.5}
.cl-loader .cl-filled .cl-word path{fill:var(--fill);stroke:none}
.cl-loader .cl-controls{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));display:flex;gap:8px}
.cl-loader button{appearance:none;font:500 13px/1 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ctl);background:rgba(250,246,249,.06);border:1px solid rgba(250,246,249,.18);border-radius:999px;padding:9px 14px;cursor:pointer}
.cl-loader button:hover:not(:disabled){color:var(--fill);border-color:rgba(250,246,249,.4)}
.cl-loader button:focus-visible{outline:2px solid var(--fill);outline-offset:2px}
.cl-loader button:disabled{opacity:.35;cursor:default}
</style>

<script>
(function(){
  const CYCLE=5600, DRAW=2650, FILL_AT=3100, FILL_DUR=700, HOLD_END=5000;
  const ease=v=>0.5-0.5*Math.cos(Math.PI*Math.min(1,Math.max(0,v)));
  function mount(root){
    const logo=root.querySelector('.cl-logo'), outline=root.querySelector('.cl-outline'),
          filled=root.querySelector('.cl-filled'), raster=root.querySelector('.cl-raster'),
          toggle=root.querySelector('.cl-toggle'), replay=root.querySelector('.cl-replay');
    const paths=[...outline.querySelectorAll('path')].map(p=>{
      const len=p.getTotalLength(); p.style.strokeDasharray=len; p.style.strokeDashoffset=len;
      return {p,len,delay:+p.dataset.delay||0};
    });
    const svg=root.querySelector('svg'), words=[...root.querySelectorAll('.cl-word')];
    const wb=words[0].getBBox();
    let stacked=null;
    function layout(){
      const s=root.clientWidth/Math.max(1,root.clientHeight)<1.05;
      if(s===stacked) return; stacked=s;
      const CW=1199,CH=1312,GAP=s?150:170,PAD=40;
      let vb,tx,ty,cx=0;
      if(!s){ tx=CW+GAP-wb.x; ty=(CH-wb.height)/2-wb.y; vb=[-PAD,-PAD,CW+GAP+wb.width+2*PAD,CH+2*PAD]; }
      else { const W=Math.max(CW,wb.width); cx=(W-CW)/2; tx=(W-wb.width)/2-wb.x; ty=CH+GAP-wb.y;
        vb=[-PAD,-PAD,W+2*PAD,CH+GAP+wb.height+2*PAD]; }
      svg.setAttribute('viewBox',vb.join(' '));
      svg.style.setProperty('--ar',(vb[2]/vb[3]).toFixed(4));
      root.querySelectorAll('.cl-chibi').forEach(g=>g.setAttribute('transform',`translate(${cx} 0)`));
      words.forEach(g=>g.setAttribute('transform',`translate(${tx} ${ty})`));
    }
    layout();
    const ro=new ResizeObserver(layout); ro.observe(root);
    const mq=matchMedia('(prefers-reduced-motion: reduce)');
    let elapsed=0,last=null,raf=0,userPaused=false,hidden=document.hidden,offscreen=false,ready=false,rasterOk=true;
    function render(t){
      for(const s of paths){ s.p.style.strokeDashoffset=s.len*(1-ease((t-s.delay)/DRAW)); }
      const f=rasterOk?ease((t-FILL_AT)/FILL_DUR):0;
      filled.setAttribute('opacity',f); outline.setAttribute('opacity',1-f);
      logo.setAttribute('opacity',t<HOLD_END?1:1-ease((t-HOLD_END)/(CYCLE-HOLD_END)));
    }
    function staticFinal(){
      for(const s of paths) s.p.style.strokeDashoffset=0;
      filled.setAttribute('opacity',rasterOk?1:0); outline.setAttribute('opacity',rasterOk?0:1); logo.setAttribute('opacity',1);
    }
    function running(){return ready&&!mq.matches&&!userPaused&&!hidden&&!offscreen;}
    function frame(now){
      if(last!==null) elapsed=(elapsed+now-last)%CYCLE;
      last=now; render(elapsed); raf=requestAnimationFrame(frame);
    }
    function sync(){
      if(running()){ if(!raf){last=null;raf=requestAnimationFrame(frame);} }
      else { cancelAnimationFrame(raf); raf=0; last=null; }
      const rm=mq.matches;
      toggle.disabled=replay.disabled=rm;
      toggle.textContent=userPaused?'Reproducir':'Pausar';
      toggle.setAttribute('aria-label',userPaused?'Reanudar animación':'Pausar animación');
      if(rm) staticFinal(); else if(ready&&!raf) render(elapsed);
    }
    const onToggle=()=>{userPaused=!userPaused;sync();};
    const onReplay=()=>{elapsed=0;userPaused=false;render(0);sync();};
    const onVis=()=>{hidden=document.hidden;sync();};
    const onHide=()=>{hidden=true;sync();}, onShow=()=>{hidden=document.hidden;sync();};
    const onMq=()=>sync();
    toggle.addEventListener('click',onToggle); replay.addEventListener('click',onReplay);
    document.addEventListener('visibilitychange',onVis);
    addEventListener('pagehide',onHide); addEventListener('pageshow',onShow);
    mq.addEventListener('change',onMq);
    const io=new IntersectionObserver(e=>{offscreen=!e[0].isIntersecting;sync();});
    io.observe(root);
    // esperar a que la imagen decodifique
    const img=new Image(); img.src=raster.getAttribute('href');
    img.decode().catch(()=>{rasterOk=false;}).finally(()=>{ready=true;render(0);sync();});
    return function unmount(){
      cancelAnimationFrame(raf); io.disconnect(); ro.disconnect();
      toggle.removeEventListener('click',onToggle); replay.removeEventListener('click',onReplay);
      document.removeEventListener('visibilitychange',onVis);
      removeEventListener('pagehide',onHide); removeEventListener('pageshow',onShow);
      mq.removeEventListener('change',onMq);
    };
  }
  document.querySelectorAll('[data-cl-loader]').forEach(mount);
})();
